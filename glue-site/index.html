<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C6A5B"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Intercom Glue Selector</title>
<style>
/* Layout: lab worksheet — selection panel on top, ranked results below; data in mono, labels condensed. */
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#13201B; --muted:#5C6B64; --line:#D6DDD8;
  --accent:#0C6A5B; --accent-ink:#FFFFFF; --amber:#B86E00; --amber-bg:#FFF2DC;
  --bar:#BFE3DA; --bar-best:#0C6A5B; --row-alt:#F7F9F7; --danger:#A33A2B;
  --display:system-ui,"Segoe UI",Roboto,Arial,sans-serif; --mono:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101614; --panel:#182019; --ink:#E8EEEA; --muted:#93A39B; --line:#2B3630;
  --accent:#4FC2AB; --accent-ink:#06211B; --amber:#F2B04F; --amber-bg:#3A2A0E;
  --bar:#24473F; --bar-best:#4FC2AB; --row-alt:#1D2721; --danger:#F08A78; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101614; --panel:#182019; --ink:#E8EEEA; --muted:#93A39B; --line:#2B3630;
  --accent:#4FC2AB; --accent-ink:#06211B; --amber:#F2B04F; --amber-bg:#3A2A0E;
  --bar:#24473F; --bar-best:#4FC2AB; --row-alt:#1D2721; --danger:#F08A78; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;
  padding:0 20px 48px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding:22px 0 14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:44px;width:auto;max-width:60vw;background:#fff;padding:4px 8px;border-radius:6px}
h1{margin:0;font-size:26px;font-weight:800;font-stretch:85%;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px}
.meta b{color:var(--ink);font-weight:600}
h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);margin-top:18px;padding:16px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:820px){.slots{grid-template-columns:1fr}}
.slot{display:grid;gap:8px;padding:12px;border:1px solid var(--line);background:var(--bg);min-width:0}
.slot.off{opacity:.55}
.slot-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.slot-h .n{color:var(--accent)}
label{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:grid;gap:3px}
select{width:100%;min-width:0;font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:3px}
select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-x{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:3px;cursor:pointer}
.btn-x:hover{color:var(--danger);border-color:var(--danger)}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;background:var(--panel);color:var(--ink);border:0;border-right:1px solid var(--line);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.group{display:grid;gap:5px}
.seg-btn{font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border:1.5px solid var(--accent);border-radius:3px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.seg-btn:disabled{opacity:.45;cursor:default}
.group>span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.upload{margin-left:auto;font-size:12px;color:var(--muted)}
.upload input{display:none}
.upload span{text-decoration:underline;cursor:pointer;color:var(--accent)}
.result{margin-top:20px}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline;padding:16px 18px;background:var(--accent);color:var(--accent-ink);margin-bottom:14px}
.verdict .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.verdict .glue{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;grid-row:span 2}
.verdict .why{font-size:14px}
.verdict .why b{font-family:var(--mono)}
.empty{padding:28px 18px;border:1px dashed var(--line);color:var(--muted);text-align:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
th.num,td.num{text-align:right}
th.sorted{color:var(--accent)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:var(--row-alt)}
td.rank{font-family:var(--mono);color:var(--muted);width:36px}
td.glue{font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
td.num{font-family:var(--mono)}
tr.best td{background:var(--amber-bg)}
tr.best td.glue::after{content:"BEST";margin-left:8px;font-size:10px;letter-spacing:.08em;color:var(--amber);vertical-align:middle}
.cell{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;min-width:96px}
.cell i{display:block;height:6px;background:var(--bar);border-radius:1px}
.cell i.top{background:var(--bar-best)}
.cell .pb{color:var(--amber);font-weight:600}
.cell .na{color:var(--muted)}
td.sub{color:var(--muted);font-size:12px;white-space:nowrap}
tr.detail td{background:var(--bg);padding:0 10px 10px 46px;border-bottom:1px solid var(--line)}
.dt{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(4,minmax(70px,1fr)) minmax(60px,.6fr);gap:2px 12px;font-size:12px;font-family:var(--mono)}
.dt .h{color:var(--muted);font-family:var(--display);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding-top:8px;border-bottom:1px solid var(--line)}
.dt .r{text-align:right}
.dt .m{font-family:var(--display);font-weight:600;overflow-wrap:anywhere}
.dt .w{color:var(--danger)}
tr.main{cursor:pointer}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 18px}
.note b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.pairs{margin-top:22px}
.sec{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;margin-right:6px;vertical-align:middle}
.gap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:14px}
.gap-col{background:var(--panel);border:1px solid var(--line);padding:12px;min-width:0;overflow-x:auto}
table.mini{min-width:0;font-size:12px}
table.mini td.glue{font-size:13px}
.tag{display:inline-block;font-size:10px;letter-spacing:.07em;padding:2px 6px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle;text-transform:uppercase}
.toast{font-size:12px;color:var(--accent);margin-top:6px;min-height:1em}
@media(max-width:600px){.verdict{grid-template-columns:1fr}.verdict .glue{grid-row:auto;font-size:28px}}
@media(prefers-reduced-motion:no-preference){.seg button,tr.main{transition:background .12s}}

.lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:grid;place-items:center;padding:20px}
.lock[hidden]{display:none}
.lock .card{background:var(--panel);border:1px solid var(--line);padding:28px 24px;max-width:380px;width:100%;display:grid;gap:14px;text-align:center}
.lock img{height:48px;width:auto;justify-self:center;background:#fff;padding:4px 8px}
.lock h2{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lock input{font:inherit;font-family:var(--mono);font-size:20px;letter-spacing:.08em;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
.lock input:focus{outline:2px solid var(--accent);border-color:transparent}
.lock button{font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.lock .err{color:var(--danger);font-size:13px;min-height:1.2em}
.lock small{color:var(--muted);font-size:12px}
.signout{margin-left:auto;font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);padding:3px 9px;border-radius:3px;cursor:pointer}
</style></head><body>
<div class="lock" id="lock"><form class="card" id="lockForm"><img src="logo.png" alt="Intercom | SKICORP"><h2>Glue Selector · restricted</h2><input id="code" placeholder="Access code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Access code"><button type="submit">Open</button><div class="err" id="lockErr"></div><small>Enter the access code issued by SKICORP. It is remembered on this device.</small></form></div>
<div class="wrap">
<header>
  <div class="brand"><img src="logo.png" alt="Intercom | SKICORP" class="logo"><h1>Glue <span>Selector</span></h1></div>
  <div class="meta"><button class="signout" id="signout" title="Forget access code on this device">Sign out</button><span id="brandMeta">INTERCOM · water-based adhesives · tensile N/mm</span><span><b id="nTests">0</b> tests</span><span><b id="nMats">0</b> materials</span><span><b id="nAdh">0</b> adhesives</span></div>
</header>

<section class="panel">
  <h2>Materials to bond</h2>
  <div class="slots" id="slots"></div>
  <div class="ctrls">
    <div class="group"><span>Adhesive brand</span><select id="brand" style="min-width:160px"></select></div>
    <div class="group"><span>Rank by strength at</span>
      <div class="seg" id="seg" role="group">
        <button data-t="0" aria-pressed="false">2 min</button>
        <button data-t="1" aria-pressed="false">15 min</button>
        <button data-t="2" aria-pressed="false">60 min</button>
        <button data-t="3" aria-pressed="true">24 hrs</button>
        <button data-t="all" aria-pressed="false">All four</button>
      </div>
    </div>
    <div class="group"><span>Report</span><button class="seg-btn" id="pdfBtn" title="Export this search as a PDF report">Export PDF report</button></div>
    <div class="group"><span>Show</span>
      <div class="seg" id="segN" role="group">
        <button data-n="5" aria-pressed="false">Top 5</button>
        <button data-n="10" aria-pressed="true">Top 10</button>
        <button data-n="999" aria-pressed="false">All</button>
      </div>
    </div>
  </div>
</section>

<section class="result" id="result"></section>
</div>

IvUuLcNvIrtVTL"},{"s":"Y5FTwuHVWbJO2D82onXYOw==","i":"GQp7VmUZd5OinN1i","c":"mAaN1mWIlm+Fk8JER894hdP7hAkFy8J7rKsQ9N/vT7S+oPc6NGOn2lT7I4HMpFUT"}]}</script>
<script>
window.__startApp=function(){
const T=['2 min','15 min','60 min','24 hrs'];
let DB=window.__DB;
let slots=[{t:'',m:''},{t:'',m:''},{t:'',m:''}];
let rankBy='3', topN=10, open=new Set(), brand='';
const ROWS=()=>DB.rows.filter(r=>!brand||r.b===brand);
const NB=()=>{const rs=ROWS();return {t:rs.length,m:new Set(rs.flatMap(r=>r.m)).size,a:new Set(rs.map(r=>r.a)).size};};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v==='PB'?'<span class="pb">PB</span>':(v==null?'<span class="na" title="Not tested in the sheet">n/t</span>':v.toFixed(2));
const score=v=>v==='PB'?99:(v==null?-1:v);

function types(){return [...new Set(Object.values(DB.materials))].sort();}
function matsOf(t){return Object.keys(DB.materials).filter(k=>DB.materials[k]===t).sort();}

function renderSlots(){
  const el=$('slots'); el.innerHTML='';
  slots.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='slot'+(i>0&&!slots[i-1].t&&!s.t?' off':'');
    d.innerHTML=`<div class="slot-h"><span><span class="n">Material ${i+1}</span>${i>1?' <span class="tag">optional</span>':''}</span>${s.t?`<button class="btn-x" data-clear="${i}">clear</button>`:''}</div>
      <label>Product type<select id="type${i}" data-i="${i}"><option value="">— select type —</option>${types().map(t=>`<option ${t===s.t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
      <label>Material name<select id="mat${i}" data-i="${i}" ${s.t?'':'disabled'}><option value="">ANY — whole product type</option>${s.t?matsOf(s.t).map(m=>`<option ${m===s.m?'selected':''}>${esc(m)}</option>`).join(''):''}</select></label>`;
    el.appendChild(d);
  });
}
$('slots').addEventListener('change',e=>{
  const i=+e.target.dataset.i;
  if(e.target.id.startsWith('type')){slots[i]={t:e.target.value,m:''};}
  else slots[i].m=e.target.value;
  open.clear(); renderSlots(); renderResult();
});
$('slots').addEventListener('click',e=>{
  if(e.target.dataset.clear!=null){slots[+e.target.dataset.clear]={t:'',m:''};open.clear();renderSlots();renderResult();}
});
$('pdfBtn').addEventListener('click',()=>{if(window.__LAST&&window.__LAST.lead)window.__exportPDF(window.__LAST,`${brand||'all brands'} · ${ROWS().length} tests`);});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;rankBy=b.dataset.t;[...$('seg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderResult();});
$('segN').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;topN=+b.dataset.n;[...$('segN').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderResult();});

// best result for (material, adhesive): prefer self-bond tests, else any test including the material. Max per time point.
const hit=(s,n)=>s.m?n===s.m:DB.materials[n]===s.t;
const lab=s=>s.m||('ANY '+s.t);
function matProfile(s){
  // COMPATIBILITY profile: only self-bond rows (material 1 = material 2, no material 3) of this article / type
  const self={};
  for(const r of ROWS()){
    if(!r.m.every(n=>hit(s,n)))continue;
    const p=self[r.a]||(self[r.a]={t:[null,null,null,null],n:0,dry:r.dry,open:r.open,tack:r.tack,src:'self'});
    p.n++; r.t.forEach((v,i)=>{if(score(v)>score(p.t[i]))p.t[i]=v;});
    if(p.dry==null)p.dry=r.dry; if(p.open==null)p.open=r.open; if(!p.tack)p.tack=r.tack;
  }
  return self;
}
function rankKey(t){
  if(rankBy==='all'){const s=t.map(score);return [s.reduce((a,b)=>a+Math.max(b,0),0)+(s.some(x=>x<0)?-1000:0),s[3]];}
  return [score(t[+rankBy]),score(t[3])];
}
function cmp(a,b){const ka=rankKey(a.t),kb=rankKey(b.t);return kb[0]-ka[0]||kb[1]-ka[1];}
const valsLine=t=>T.map((n,i)=>`${n} <b>${t[i]==='PB'?'PB':(t[i]==null?'n/t':t[i].toFixed(2))}</b>`).join(' · ');
function sideBySide(profiles,sel){
  return `<div class="gap">${profiles.map((p,i)=>{const list=Object.keys(p).map(a=>({a,t:p[a].t,n:p[a].n})).sort(cmp);
    return `<div class="gap-col"><h2>${esc(sel[i])} <span class="tag">${list.length} glues</span></h2>${list.length?`<table class="mini"><thead><tr><th>Adhesive</th>${T.map(n=>`<th class="num">${n}</th>`).join('')}</tr></thead><tbody>${list.map(r=>`<tr><td class="glue">${esc(DB.adhesives[r.a]||r.a)}</td>${r.t.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="note">No compatibility test on this article (never tested bonded to itself).</p>'}</div>`;}).join('')}</div>`;
}

function renderResult(){
  const selS=slots.filter(s=>s.t); const sel=selS.map(lab);
  const el=$('result');
  if(sel.length===0){window.__LAST=null;$('pdfBtn').disabled=true;el.innerHTML='<div class="empty">Pick a product type (and a material name if you want) for Material 1 — and Material 2 for a pair. Search works by material name or by whole product type.</div>';return;}
  const label=rankBy==='all'?'all four time points':T[+rankBy];
  // ---------- SECTION 1: COMPATIBILITY (self-bond rows only)
  const profiles=selS.map(matProfile);
  const common=Object.keys(profiles[0]).filter(a=>profiles.every(p=>p[a]));
  const rows=common.map(a=>{
    const per=profiles.map(p=>p[a]);
    const t=[0,1,2,3].map(i=>{let w=null,ws=Infinity;per.forEach(p=>{const s=score(p.t[i]);if(s<ws){ws=s;w=p.t[i];}});return w;});
    return {a,t,per,n:per.reduce((x,p)=>x+p.n,0),dry:per[0].dry,open:per[0].open,tack:per[0].tack};
  }).sort(cmp);
  // ---------- SECTION 2: COMBINATION (rows that are exactly this combination)
  const key=selS.map((s,i)=>i).sort().join('|');
  const pairMap={};
  if(sel.length>1)for(const r of ROWS()){
    const idx=r.m.map(n=>{let k=selS.findIndex(s=>s.m&&hit(s,n));if(k<0)k=selS.findIndex(s=>!s.m&&hit(s,n));return k;});
    if(idx.some(k=>k<0))continue;
    const rk=[...new Set(idx)].sort().join('|'); if(rk!==key)continue;
    const p=pairMap[r.a]||(pairMap[r.a]={a:r.a,t:[null,null,null,null],n:0,dry:r.dry,open:r.open,tack:r.tack});
    p.n++; r.t.forEach((v,i)=>{if(score(v)>score(p.t[i]))p.t[i]=v;});
  }
  const pairs=Object.values(pairMap).sort(cmp);

  let h='';
  const lead=pairs[0]||rows[0];
  if(lead){
    const src=pairs[0]?`from the combination test (${sel.map(esc).join(' + ')} tested directly)`:(sel.length>1?`from the compatibility test — common glue, weakest-link across ${sel.length} materials`:'from the compatibility test');
    h+=`<div class="verdict"><div class="k">Recommended · ranked by ${label}</div><div class="glue">${esc(DB.adhesives[lead.a]||lead.a)}</div>
      <div class="why">${valsLine(lead.t)} N/mm — ${src}${lead.tack?` · tack ${esc(lead.tack)}`:''}${lead.open!=null?` · open time ${lead.open} min`:''}</div></div>`;
  } else {
    h+=`<div class="empty">No recommendation possible: no common compatibility glue and no direct combination test for ${sel.map(esc).join(' + ')}.</div>`;
  }
  {const gaps=profiles.map((p,i)=>({m:sel[i],miss:Object.keys(p).length?[0,1,2].filter(t=>Object.values(p).every(x=>x.t[t]==null)).map(t=>T[t]):[]})).filter(g=>g.miss.length);
    window.__GAPS=gaps.map(g=>`${g.m} at ${g.miss.join(' / ')}`).join('; ');
    if(gaps.length)h+=`<p class="note" style="margin:0 0 12px"><span style="color:var(--amber)">Not tested in the sheet: ${gaps.map(g=>`${esc(g.m)} at ${g.miss.join(' / ')}`).join('; ')} — only the measured time points can be ranked.</span></p>`;}

  // Section 1 render
  h+=`<div class="pairs"><h2><span class="sec">1</span> Compatibility test · material bonded to itself <span class="tag">${sel.length>1?`${rows.length} common glues`:`${rows.length} glues`}</span></h2>`;
  if(sel.length===1){
    h+=rows.length?table(rows,false):`<div class="empty">No compatibility test on ${esc(sel[0])} in the sheet.</div>`;
  } else if(rows.length){
    h+=`<p class="note" style="margin:0 0 8px">Glues tested on every selected material — weakest-link value shown; click a row to see each material.</p>`+table(rows,true);
  } else {
    h+=`<div class="empty">No common glue across ${sel.map(esc).join(' and ')}. Each material's own compatibility results, side by side:</div>`+sideBySide(profiles,sel);
  }
  h+=`</div>`;
  // Section 2 render
  if(sel.length>1){
    h+=`<div class="pairs"><h2><span class="sec">2</span> Combination test · ${sel.map(esc).join(' + ')} bonded directly <span class="tag">${pairs.length} glues</span></h2>`;
    h+=pairs.length?table(pairs,false):`<div class="empty">No direct combination test found for ${sel.map(esc).join(' + ')}.</div>`;
    h+=`</div>`;
  }
  h+=`<p class="note"><span><b>PB</b> = material broke before the bond (strongest possible result)</span><span><b>n/t</b> = not tested in the sheet</span><span>Best reading across repeat tests per cell (and across all articles of a type when ANY is chosen)</span></p>`;
  window.__LAST={sel,types:selS.map(s=>s.t),lead,leadName:lead?(DB.adhesives[lead.a]||lead.a):'',direct:!!pairs[0],pairs,rows,side:(sel.length>1&&!rows.length)?profiles.map(p=>Object.keys(p).map(a=>({a,t:p[a].t,n:p[a].n})).sort(cmp)):null,label,rankBy,names:DB.adhesives,gaps:(window.__GAPS||'')};

function table(list,expandable){

      h+=`</div></td></tr>`;
    }
  });
  h+=`</tbody></table></div>`;
  if(list.length>shown.length)h+=`<p class="note">${list.length-shown.length} more not shown — switch to “All”.</p>`;

<script>
(function(){
const E=JSON.parse(document.getElementById('enc').textContent);
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const enc=new TextEncoder();
async function unwrap(code){
  const base=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  for(const w of E.wraps){
    try{
      const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(w.s),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(w.i)},wk,u8(w.c));
      return new Uint8Array(raw);
    }catch(e){}
  }
  return null;
}
async function openWith(rawKey){
  const k=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  let pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(E.iv)},k,u8(E.ct));
  if(E.gz){pt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();}
  window.__DB=JSON.parse(new TextDecoder().decode(pt));
  document.getElementById('lock').hidden=true;
  window.__startApp();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
}
const b64=a=>btoa(String.fromCharCode(...a));
async function boot(){
  let saved=null; try{saved=localStorage.getItem('glueKey');}catch(e){}
  if(saved){try{await openWith(u8(saved));return;}catch(e){try{localStorage.removeItem('glueKey');}catch(x){}}}
  setTimeout(()=>document.getElementById('code').focus(),50);
}
document.getElementById('lockForm').addEventListener('submit',async ev=>{
  ev.preventDefault(); const inp=document.getElementById('code'); const err=document.getElementById('lockErr');
  const code=inp.value.trim().toUpperCase().replace(/\s+/g,''); if(!code)return; err.textContent='Checking…';
  const raw=await unwrap(code);
  if(!raw){err.textContent='Code not recognised or revoked.';inp.select();return;}
  try{localStorage.setItem('glueKey',b64(raw));}catch(e){}
  err.textContent=''; await openWith(raw);
});
document.getElementById('signout').addEventListener('click',()=>{try{localStorage.removeItem('glueKey');}catch(e){}location.reload();});
boot();
})();
