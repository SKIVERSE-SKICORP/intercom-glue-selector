<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C6A5B"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Intercom Glue Selector</title>
<style>
/* Layout: lab worksheet — selection panel on top, ranked results below; data in mono, labels condensed. */
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#13201B; --muted:#5C6B64; --line:#D6DDD8;
  --accent:#0C6A5B; --accent-ink:#FFFFFF; --amber:#B86E00; --amber-bg:#FFF2DC;
  --bar:#BFE3DA; --bar-best:#0C6A5B; --row-alt:#F7F9F7; --danger:#A33A2B;
  --display:system-ui,"Segoe UI",Roboto,Arial,sans-serif; --mono:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101614; --panel:#182019; --ink:#E8EEEA; --muted:#93A39B; --line:#2B3630;
  --accent:#4FC2AB; --accent-ink:#06211B; --amber:#F2B04F; --amber-bg:#3A2A0E;
  --bar:#24473F; --bar-best:#4FC2AB; --row-alt:#1D2721; --danger:#F08A78; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101614; --panel:#182019; --ink:#E8EEEA; --muted:#93A39B; --line:#2B3630;
  --accent:#4FC2AB; --accent-ink:#06211B; --amber:#F2B04F; --amber-bg:#3A2A0E;
  --bar:#24473F; --bar-best:#4FC2AB; --row-alt:#1D2721; --danger:#F08A78; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;
  padding:0 20px 48px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding:22px 0 14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:44px;width:auto;max-width:60vw;background:#fff;padding:4px 8px;border-radius:6px}
h1{margin:0;font-size:26px;font-weight:800;font-stretch:85%;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px}
.meta b{color:var(--ink);font-weight:600}
h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);margin-top:18px;padding:16px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:820px){.slots{grid-template-columns:1fr}}
.slot{display:grid;gap:8px;padding:12px;border:1px solid var(--line);background:var(--bg);min-width:0}
.slot.off{opacity:.55}
.slot-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.slot-h .n{color:var(--accent)}
label{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:grid;gap:3px}
select{width:100%;min-width:0;font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:3px}
select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-x{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:3px;cursor:pointer}
.btn-x:hover{color:var(--danger);border-color:var(--danger)}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;background:var(--panel);color:var(--ink);border:0;border-right:1px solid var(--line);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.group{display:grid;gap:5px}
.group>span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.upload{margin-left:auto;font-size:12px;color:var(--muted)}
.upload input{display:none}
.upload span{text-decoration:underline;cursor:pointer;color:var(--accent)}
.result{margin-top:20px}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline;padding:16px 18px;background:var(--accent);color:var(--accent-ink);margin-bottom:14px}
.verdict .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.verdict .glue{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;grid-row:span 2}
.verdict .why{font-size:14px}
.verdict .why b{font-family:var(--mono)}
.empty{padding:28px 18px;border:1px dashed var(--line);color:var(--muted);text-align:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
th.num,td.num{text-align:right}
th.sorted{color:var(--accent)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:var(--row-alt)}
td.rank{font-family:var(--mono);color:var(--muted);width:36px}
td.glue{font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
td.num{font-family:var(--mono)}
tr.best td{background:var(--amber-bg)}
tr.best td.glue::after{content:"BEST";margin-left:8px;font-size:10px;letter-spacing:.08em;color:var(--amber);vertical-align:middle}
.cell{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;min-width:96px}
.cell i{display:block;height:6px;background:var(--bar);border-radius:1px}
.cell i.top{background:var(--bar-best)}
.cell .pb{color:var(--amber);font-weight:600}
.cell .na{color:var(--muted)}
td.sub{color:var(--muted);font-size:12px;white-space:nowrap}
tr.detail td{background:var(--bg);padding:0 10px 10px 46px;border-bottom:1px solid var(--line)}
.dt{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(4,minmax(70px,1fr)) minmax(60px,.6fr);gap:2px 12px;font-size:12px;font-family:var(--mono)}
.dt .h{color:var(--muted);font-family:var(--display);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding-top:8px;border-bottom:1px solid var(--line)}
.dt .r{text-align:right}
.dt .m{font-family:var(--display);font-weight:600;overflow-wrap:anywhere}
.dt .w{color:var(--danger)}
tr.main{cursor:pointer}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 18px}
.note b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.pairs{margin-top:22px}
.gap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:14px}
.gap-col{background:var(--panel);border:1px solid var(--line);padding:12px;min-width:0;overflow-x:auto}
table.mini{min-width:0;font-size:12px}
table.mini td.glue{font-size:13px}
.tag{display:inline-block;font-size:10px;letter-spacing:.07em;padding:2px 6px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle;text-transform:uppercase}
.toast{font-size:12px;color:var(--accent);margin-top:6px;min-height:1em}
@media(max-width:600px){.verdict{grid-template-columns:1fr}.verdict .glue{grid-row:auto;font-size:28px}}
@media(prefers-reduced-motion:no-preference){.seg button,tr.main{transition:background .12s}}
</style></head><body>

 "b": "INTERCOM", "t": [null, null, null, 1.83], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "KC5003", "b": "OTHER / UNBRANDED", "t": [null, null, null, 2.62], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "KC5006", "b": "OTHER / UNBRANDED", "t": [null, null, null, 3.13], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "5009", "b": "INTERCOM", "t": [null, null, null, 3.99], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BROWN)", "LEATHER (TAN)"], "a": "KC5003", "b": "OTHER / UNBRANDED", "t": [null, null, null, 1.73], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BROWN)", "LEATHER (TAN)"], "a": "KC5006", "b": "OTHER / UNBRANDED", "t": [null, null, null, 2.27], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BROWN)", "LEATHER (TAN)"], "a": "5009", "b": "INTERCOM", "t": [null, null, null, 2.23], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "KC5003", "b": "OTHER / UNBRANDED", "t": [null, null, null, 1.32], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "KC5006", "b": "OTHER / UNBRANDED", "t": [null, null, null, 2.53], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "5009", "b": "INTERCOM", "t": [null, null, null, 2.13], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BROWN)", "LEATHER (CHOCOLATE)"], "a": "KC5003", "b": "OTHER / UNBRANDED", "t": [null, null, null, 1.74], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BROWN)", "LEATHER (CHOCOLATE)"], "a": "KC5006", "b": "OTHER / UNBRANDED", "t": [null, null, null, 2.99], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BROWN)", "LEATHER (CHOCOLATE)"], "a": "5009", "b": "INTERCOM", "t": [null, null, null, 2.63], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "KC5003", "b": "OTHER / UNBRANDED", "t": [null, null, null, 1.37], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "KC5006", "b": "OTHER / UNBRANDED", "t": [null, null, null, 2.17], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}, {"m": ["LEATHER (BLACK)", "LEATHER (BLACK)"], "a": "5009", "b": "INTERCOM", "t": [null, null, null, 2.19], "dry": 120, "open": null, "tack": null, "cust": "ZAINBOUNCO"}]}</script>
<script>
(function(){
const T=['2 min','15 min','60 min','24 hrs'];
let DB=JSON.parse(document.getElementById('data').textContent);
let slots=[{t:'',m:''},{t:'',m:''},{t:'',m:''}];
let rankBy='3', topN=10, open=new Set(), brand='';
const ROWS=()=>DB.rows.filter(r=>!brand||r.b===brand);
const NB=()=>{const rs=ROWS();return {t:rs.length,m:new Set(rs.flatMap(r=>r.m)).size,a:new Set(rs.map(r=>r.a)).size};};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v==='PB'?'<span class="pb">PB</span>':(v==null?'<span class="na">—</span>':v.toFixed(2));
const score=v=>v==='PB'?99:(v==null?-1:v);

function types(){return [...new Set(Object.values(DB.materials))].sort();}
function matsOf(t){return Object.keys(DB.materials).filter(k=>DB.materials[k]===t).sort();}

function renderSlots(){
  const el=$('slots'); el.innerHTML='';
  slots.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='slot'+(i>0&&!slots[i-1].t&&!s.t?' off':'');
    d.innerHTML=`<div class="slot-h"><span><span class="n">Material ${i+1}</span>${i>1?' <span class="tag">optional</span>':''}</span>${s.t?`<button class="btn-x" data-clear="${i}">clear</button>`:''}</div>
      <label>Product type<select id="type${i}" data-i="${i}"><option value="">— select type —</option>${types().map(t=>`<option ${t===s.t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
      <label>Material name<select id="mat${i}" data-i="${i}" ${s.t?'':'disabled'}><option value="">ANY — whole product type</option>${s.t?matsOf(s.t).map(m=>`<option ${m===s.m?'selected':''}>${esc(m)}</option>`).join(''):''}</select></label>`;
    el.appendChild(d);
  });
}
$('slots').addEventListener('change',e=>{
  const i=+e.target.dataset.i;
  if(e.target.id.startsWith('type')){slots[i]={t:e.target.value,m:''};}
  else slots[i].m=e.target.value;
  open.clear(); renderSlots(); renderResult();
});
$('slots').addEventListener('click',e=>{
  if(e.target.dataset.clear!=null){slots[+e.target.dataset.clear]={t:'',m:''};open.clear();renderSlots();renderResult();}
});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;rankBy=b.dataset.t;[...$('seg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderResult();});
$('segN').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;topN=+b.dataset.n;[...$('segN').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderResult();});

// best result for (material, adhesive): prefer self-bond tests, else any test including the material. Max per time point.
const hit=(s,n)=>s.m?n===s.m:DB.materials[n]===s.t;
const lab=s=>s.m||('ANY '+s.t);
function matProfile(s){
  const self={},any={};
  for(const r of ROWS()){
    if(!r.m.some(n=>hit(s,n)))continue;
    const isSelf=r.m.every(n=>hit(s,n));
    const tgt=isSelf?self:any;
    const p=tgt[r.a]||(tgt[r.a]={t:[null,null,null,null],n:0,dry:r.dry,open:r.open,tack:r.tack,src:isSelf?'self':'pair'});
    p.n++; r.t.forEach((v,i)=>{if(score(v)>score(p.t[i]))p.t[i]=v;});
    if(p.dry==null)p.dry=r.dry; if(p.open==null)p.open=r.open; if(!p.tack)p.tack=r.tack;
  }
  const out={...any,...self}; return out;
}
function rankKey(t){
  if(rankBy==='all'){const s=t.map(score);return [s.reduce((a,b)=>a+Math.max(b,0),0)+(s.some(x=>x<0)?-1000:0),s[3]];}
  return [score(t[+rankBy]),score(t[3])];
}
function cmp(a,b){const ka=rankKey(a.t),kb=rankKey(b.t);return kb[0]-ka[0]||kb[1]-ka[1];}

function renderResult(){
  const selS=slots.filter(s=>s.t); const sel=selS.map(lab);
  const el=$('result');
  if(sel.length===0){el.innerHTML='<div class="empty">Pick a product type in slot 1 (and a material name if you want) to see the ranked adhesives. Add a second (and third) material to find the glues that work on all of them.</div>';return;}
  let profiles=selS.map(matProfile);
  // common adhesives
  let common=Object.keys(profiles[0]).filter(a=>profiles.every(p=>p[a]));
  const widened=[]; window.__labels=null;
  const rows=common.map(a=>{
    const per=profiles.map(p=>p[a]);
    const t=[0,1,2,3].map(i=>{let w=null,ws=Infinity;per.forEach(p=>{const s=score(p.t[i]);if(s<ws){ws=s;w=p.t[i];}});return w;});
    return {a,t,per,n:per.reduce((x,p)=>x+p.n,0),dry:per[0].dry,open:per[0].open,tack:per[0].tack};
  }).sort(cmp);
  // direct pair tests (exact material set)
  const key=selS.map((s,i)=>i).sort().join('|');
  const pairMap={};
  for(const r of ROWS()){
    if(sel.length<2)break;
    const idx=r.m.map(n=>{let k=selS.findIndex(s=>s.m&&hit(s,n));if(k<0)k=selS.findIndex(s=>!s.m&&hit(s,n));return k;});
    if(idx.some(k=>k<0))continue;
    const rk=[...new Set(idx)].sort().join('|'); if(rk!==key)continue;
    const p=pairMap[r.a]||(pairMap[r.a]={a:r.a,t:[null,null,null,null],n:0,dry:r.dry,open:r.open,tack:r.tack});
    p.n++; r.t.forEach((v,i)=>{if(score(v)>score(p.t[i]))p.t[i]=v;});
  }
  const pairs=Object.values(pairMap).sort(cmp);

  let h='';
  const label=rankBy==='all'?'all four time points':T[+rankBy];
  const lead=(pairs[0]||rows[0]);
  if(lead){
    const src=pairs[0]?'tested as this exact combination':`weakest-link across ${sel.length} material${sel.length>1?'s':''}`;
    h+=`<div class="verdict"><div class="k">Recommended · ranked by ${label}</div><div class="glue">${esc(DB.adhesives[lead.a]||lead.a)}</div>
      <div class="why">${T.map((n,i)=>`${n} <b>${lead.t[i]==='PB'?'PB':(lead.t[i]==null?'—':lead.t[i].toFixed(2))}</b>`).join(' · ')} N/mm — ${src}${lead.tack?` · tack ${esc(lead.tack)}`:''}${lead.open!=null?` · open time ${lead.open} min`:''}</div></div>`;
  } else {
    h+=`<div class="empty">No adhesive has been tested on both ${sel.map(esc).join(' and ')}. Tested so far on each (ranked by 24 hrs):</div>
      <div class="gap">${profiles.map((p,i)=>{const list=Object.keys(p).map(a=>({a,t:p[a].t,n:p[a].n})).sort(cmp);
        return `<div class="gap-col"><h2>${esc(sel[i])} <span class="tag">${list.length} glues</span></h2>${list.length?`<table class="mini"><thead><tr><th>Adhesive</th>${T.map(n=>`<th class="num">${n}</th>`).join('')}</tr></thead><tbody>${list.map(r=>`<tr><td class="glue">${esc(DB.adhesives[r.a]||r.a)}</td>${r.t.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="note">No tests on this article.</p>'}</div>`;}).join('')}</div>
      <p class="note">To get a recommendation, test the missing glues on ${sel.map(esc).join(' or ')} and reload the sheet.</p>`;
  }
  if(pairs.length){
    h+=`<div class="pairs"><h2>Tested directly as ${sel.map(esc).join(' + ')} <span class="tag">${pairs.length} adhesives</span></h2>${table(pairs,false)}</div>`;
  }
  if(widened.length){
    h+=`<p class="note" style="margin:0 0 12px"><span style="color:var(--amber)">No glue has been tested on ${widened.map(esc).join(' and ')} together with the other selection — results use the whole product type (${widened.map(m=>esc(DB.materials[m])).join(', ')}) for ${widened.length>1?'those articles':'that article'}.</span></p>`;
  }
  if(sel.length>=1&&rows.length){
    h+=`<div class="pairs"><h2>${sel.length>1?`Adhesives tested on every selected material — weakest-link value shown`:`All adhesives tested on ${esc(sel[0])}`} <span class="tag">${rows.length} adhesives</span></h2>${table(rows,sel.length>1)}
      <p class="note"><span><b>PB</b> = material broke before the bond (strongest possible result)</span><span><b>—</b> = not measured</span><span>Per cell the best reading across repeat tests (and across all materials of a type when ANY is chosen) is used</span>${sel.length>1?'<span>Weakest-link = the lowest of the materials\' individual values; click a row to see each material</span>':''}</p></div>`;
  }
  el.innerHTML=h;
}
function table(list,expandable){
  const shown=list.slice(0,topN);
  const max=[0,1,2,3].map(i=>Math.max(0,...list.map(r=>{const s=score(r.t[i]);return s===99?0:s;})));
  let h=`<div class="tbl-wrap"><table><thead><tr><th></th><th>Adhesive</th>${T.map((n,i)=>`<th class="num ${String(i)===rankBy?'sorted':''}">${n}</th>`).join('')}<th class="num">Tests</th><th>Dry s</th><th>Open min</th><th>Tack</th></tr></thead><tbody>`;
  shown.forEach((r,idx)=>{
    const isOpen=open.has(r.a);
    h+=`<tr class="main ${idx===0?'best':''}" data-a="${esc(r.a)}" data-x="${expandable?1:0}"><td class="rank">${idx+1}</td><td class="glue">${esc(DB.adhesives[r.a]||r.a)}</td>`;
    r.t.forEach((v,i)=>{const s=score(v);const w=s===99?100:(s<0?0:(max[i]?s/max[i]*100:0));
      h+=`<td class="num"><span class="cell"><i class="${idx===0&&String(i)===rankBy?'top':''}" style="width:${w.toFixed(0)}%"></i><span>${fmt(v)}</span></span></td>`;});
    h+=`<td class="num sub">${r.n}</td><td class="sub">${r.dry??'—'}</td><td class="sub">${r.open??'—'}</td><td class="sub">${r.tack?esc(r.tack):'—'}</td></tr>`;
    if(expandable&&isOpen){
      const sel=window.__labels||slots.filter(s=>s.t).map(lab);
      h+=`<tr class="detail"><td colspan="10"><div class="dt"><div class="h">Material</div>${T.map(n=>`<div class="h r">${n}</div>`).join('')}<div class="h r">Tests</div>`;
      r.per.forEach((p,k)=>{h+=`<div class="m">${esc(sel[k])}${p.src==='pair'?' <span class="tag">from pair test</span>':''}</div>${p.t.map((v,i)=>`<div class="r ${v===r.t[i]&&score(v)<99?'w':''}">${fmt(v)}</div>`).join('')}<div class="r">${p.n}</div>`;});
      h+=`</div></td></tr>`;
    }
  });
  h+=`</tbody></table></div>`;
  if(list.length>shown.length)h+=`<p class="note">${list.length-shown.length} more not shown — switch to “All”.</p>`;
  return h;
}
$('result').addEventListener('click',e=>{
  const tr=e.target.closest('tr.main'); if(!tr||tr.dataset.x!=='1')return;
  const a=tr.dataset.a; open.has(a)?open.delete(a):open.add(a); renderResult();
});

// ---- Excel reload (same column layout as COMPILE_COMPATIBILITY sheet) ----
const TYPE_MERGE={'PU , PVC , SYNTHETIC LEATHER':'PU / PVC / SYNTHETIC LEATHER','PVC, SYNTHETIC LEATHER':'PU / PVC / SYNTHETIC LEATHER','SYNTHETIC LEATHER, PVC LEATHER, NONWOVEN':'PU / PVC / SYNTHETIC LEATHER','POLYSTER LINING':'POLYESTER LINING','EVA , RUBBER':'EVA / RUBBER'};
const clean=s=>{if(s==null)return null;s=String(s).replace(/\s+/g,' ').trim().toUpperCase().replace(/\s*-\s+/g,' - ').replace(/(\S)\(/g,'$1 (');return s||null;};
const num=v=>{if(typeof v==='number')return v;if(v==null)return null;const m=String(v).match(/[\d.]+/);return m?parseFloat(m[0]):null;};
const val=v=>{if(typeof v==='number')return Math.round(v*100)/100;if(v==null)return null;const s=String(v).trim().toUpperCase();if(s==='PB')return 'PB';const n=parseFloat(s);return isNaN(n)?null:Math.round(n*100)/100;};
$('file').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const wb=XLSX.read(rd.result,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
      const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      const mats={},adh={},rows=[];
      for(const r of arr.slice(2)){
        if(!r||!r.slice(0,9).some(x=>x!=null))continue;
        const m=[];[[0,1],[2,3],[4,5]].forEach(([ti,ni])=>{const n=clean(r[ni]);if(n){m.push(n);let t=clean(r[ti]);t=TYPE_MERGE[t]||t||DB.materials[n]||'OTHER';if(!mats[n]||mats[n]==='OTHER')mats[n]=t;}});
        const ad=clean(r[8]); if(!ad||!m.length)continue; const a=ad.replace(/ /g,''); adh[a]=adh[a]||ad;
        const tack=clean(r[18]); rows.push({m,a,b:clean(r[6])||'OTHER / UNBRANDED',t:[9,10,11,12].map(i=>val(r[i])),dry:num(r[16]),open:num(r[17]),tack:tack&&tack!=='-'?tack:null});
      }
      if(!rows.length)throw new Error('no rows found');
      DB={materials:mats,adhesives:adh,rows}; slots=[{t:'',m:''},{t:'',m:''},{t:'',m:''}]; open.clear();
      $('toast').textContent=`Loaded ${rows.length} tests from ${f.name}`; brands(); stats(); renderSlots(); renderResult();
    }catch(err){$('toast').textContent='Could not read that file: '+err.message;}
  };
  rd.readAsArrayBuffer(f);
});
function brands(){const bs=[...new Set(DB.rows.map(r=>r.b))].sort();const el=$('brand');el.innerHTML=bs.map(b=>`<option>${esc(b)}</option>`).join('')+(bs.length>1?'<option value="">ALL BRANDS</option>':'');brand=bs.includes('INTERCOM')?'INTERCOM':(bs.includes(brand)?brand:bs[0]);el.value=brand;$('brandMeta').textContent=(brand||'All brands')+' · water-based adhesives · tensile N/mm';}
$('brand').addEventListener('change',e=>{brand=e.target.value;$('brandMeta').textContent=(brand||'All brands')+' · water-based adhesives · tensile N/mm';open.clear();stats();renderResult();});
function stats(){const n=NB();$('nTests').textContent=n.t;$('nMats').textContent=n.m;$('nAdh').textContent=n.a;}
// opening state: a real working example
slots[0]={t:'LEATHER',m:'LEATHER -SOFT'}; slots[1]={t:'PU / PVC / SYNTHETIC LEATHER',m:'SYNTHETIC PU LEATHER WITH KNITTED POLYESTER 3 - SIRACO'};
brands(); stats(); renderSlots(); renderResult();
// The viewer may restore earlier dropdown values after load without firing change events: reconcile DOM -> state.
function reconcile(){
  let changed=false;
  const bEl=$('brand'); const bs=[...bEl.options].map(o=>o.value);
  if(bEl.value!==brand){ if(bs.includes(bEl.value)&&(bEl.value||bs.length>1)){brand=bEl.value;changed=true;} else bEl.value=brand; }
  slots.forEach((s,i)=>{
    const tEl=$('type'+i), mEl=$('mat'+i); if(!tEl)return;
    const t=tEl.value, m=mEl?mEl.value:'';
    if(t!==s.t){ s.t=types().includes(t)?t:''; s.m=''; changed=true; }
    else if(m!==s.m){ s.m=(s.t&&matsOf(s.t).includes(m))?m:''; changed=true; }
  });
  if(changed){open.clear();renderSlots();renderResult();}
}
[150,600,1500,3000].forEach(ms=>setTimeout(reconcile,ms)); let ticks=0; const iv=setInterval(()=>{reconcile(); if(++ticks>20)clearInterval(iv);},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)reconcile();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body></html>
